name: Build Nutrio APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Find and extract Nutrio project
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'Nutrio_Android_APK_Build*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Nutrio ZIP not found"
            exit 1
          fi
          unzip -o "$ZIP"
          echo "Project extracted:"
          ls -la nutrio_android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Nutrio dependencies
        working-directory: nutrio_android
        run: npm install

      - name: Create Android project
        working-directory: nutrio_android
        run: npx cap add android

      - name: Sync Nutrio
        working-directory: nutrio_android
        run: npx cap sync android

      - name: Build APK
        working-directory: nutrio_android/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload Nutrio APK
        uses: actions/upload-artifact@v4
        with:
          name: Nutrio-APK
          path: nutrio_android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
